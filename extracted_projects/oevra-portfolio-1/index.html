<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Портфолио UX/UI дизайнера" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬡</text></svg>" />
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@200;300;400&family=Inter:wght@200;300;400;500;600&family=Manrope:wght@200;300;400;500;600&display=swap" rel="stylesheet">

    <style>
      html, body {
        background-color: #eef0f5 !important;
      }

      /* Prevent dark flash before React mounts */
      #root > div {
        background-color: transparent !important;
      }

      /* UnicornScene fade-in */
      .aura-background-component canvas,
      .aura-background-component iframe {
        animation: unicornFadeIn 1.2s ease-out both;
        animation-delay: 0.05s;
      }

      @keyframes unicornFadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      /* Ensure text is always visible — no hidden state before JS runs */
      .word-blur-target {
        visibility: visible !important;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
